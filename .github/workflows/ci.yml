name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check coinche
      - name: Tests and bot strategy coverage
        run: |
          python -m coverage run --branch -m pytest -v
          python -m coverage report --fail-under=100 coinche/bot_types/default.py
          python -m coverage report --fail-under=100 coinche/bot_types/maestro.py
