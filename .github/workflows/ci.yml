name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check coinche
      - name: Tests and bot strategy coverage
        run: |
          uv run coverage run --branch -m pytest -v
          uv run coverage report --fail-under=100 coinche/bot_types/default.py
          uv run coverage report --fail-under=100 coinche/bot_types/maestro.py
